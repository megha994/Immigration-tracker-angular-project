<header class="app-header">
  <div class="header-left">
    <img class="brand-logo" (click)="goToDashboard()" src="/images/ca-flag.jpg" alt="maple leaf" width="250"
      height="50" />
  </div>

  <div class="header-title">
    <h1>Immigration Tracker</h1>
  </div>

  <div class="header-right">
    <img class="user-avatar" src="/images/user.png" alt="user avatar" />

    <!-- Show Login when NOT logged in -->
    <button class="login-button" type="button" *ngIf="!isLoggedIn" (click)="onLogin()">
      Login
    </button>

    <!-- Show Logout when logged in -->
    <button class="login-button" type="button" *ngIf="isLoggedIn" (click)="onLogout()">
      Logout
    </button>
  </div>
</header>
