<nav class="navbar" [class.collapsed]="!isNavOpen">
  <div class="navbar-container">

    <!-- Header -->
    <div class="navbar-header">
      <h1 class="navbar-title">Immigration Tracker</h1>

      <button class="navbar-toggle" (click)="toggleNav()" [class.active]="isNavOpen" data-tooltip="Toggle Menu">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </button>
    </div>

    <!-- Menu -->
    <ul class="navbar-menu" [class.open]="isNavOpen">

      <!-- Dashboard -->
      <li class="navbar-item">
        <button class="navbar-link dashboard-link" routerLink="/dashboard" data-tooltip="Dashboard">
          <div class="icon-circle icon-chart">
            <i class="pi pi-chart-bar"></i>
          </div>
          <span class="navbar-text">Dashboard</span>
        </button>
      </li>

      <!-- IRCC Applications -->
      <li class="navbar-item">
        <button class="navbar-link category-toggle"
                (click)="toggleCategory('applicationCategories')"
                data-tooltip="IRCC Applications">

          <div class="icon-circle icon-folder">
            <i class="pi pi-folder-open"></i>
          </div>

          <span class="navbar-text">IRCC Applications</span>
          <span class="toggle-icon" [class.expanded]="expandedCategory === 'applicationCategories'">▼</span>
        </button>

        <ul class="navbar-submenu" *ngIf="expandedCategory === 'applicationCategories'">

          <li class="navbar-subitem">
            <button class="navbar-sublink" [routerLink]="['/study-permit','study']" data-tooltip="Study Permit">
              <div class="icon-circle icon-book">
                <i class="pi pi-book"></i>
              </div>
              <span>Study Permit</span>
            </button>
          </li>

          <li class="navbar-subitem">
            <button class="navbar-sublink" data-tooltip="Work Permit">
              <div class="icon-circle icon-briefcase">
                <i class="pi pi-briefcase"></i>
              </div>
              <span>Work Permit</span>
            </button>
          </li>

          <li class="navbar-subitem">
            <button class="navbar-sublink" data-tooltip="Study Permit Extension">
              <div class="icon-circle icon-refresh">
                <i class="pi pi-refresh"></i>
              </div>
              <span>Study Permit Extension</span>
            </button>
          </li>

          <li class="navbar-subitem">
            <button class="navbar-sublink" data-tooltip="Work Permit Extension">
              <div class="icon-circle icon-refresh">
                <i class="pi pi-refresh"></i>
              </div>
              <span>Work Permit Extension</span>
            </button>
          </li>

          <li class="navbar-subitem">
            <button class="navbar-sublink" data-tooltip="Permanent Residence">
              <div class="icon-circle icon-home">
                <i class="pi pi-home"></i>
              </div>
              <span>Permanent Residence</span>
            </button>
          </li>

          <li class="navbar-subitem">
            <button class="navbar-sublink" data-tooltip="Spousal Work Permit">
              <div class="icon-circle icon-users">
                <i class="pi pi-users"></i>
              </div>
              <span>Spousal Work Permit</span>
            </button>
          </li>

          <li class="navbar-subitem">
            <button class="navbar-sublink" data-tooltip="Visitor Visa">
              <div class="icon-circle icon-id">
                <i class="pi pi-id-card"></i>
              </div>
              <span>Visitor Visa</span>
            </button>
          </li>

          <li class="navbar-subitem">
            <button class="navbar-sublink" data-tooltip="Super Visa">
              <div class="icon-circle icon-shield">
                <i class="pi pi-shield"></i>
              </div>
              <span>Super Visa</span>
            </button>
          </li>

        </ul>
      </li>

      <!-- New Application -->
      <li class="navbar-item">
        <button class="navbar-link" routerLink="/my-applications" data-tooltip="New Application">
          <div class="icon-circle icon-plus">
            <i class="pi pi-plus-circle"></i>
          </div>
          <span class="navbar-text">New Application</span>
        </button>
      </li>

      <!-- My Account -->
      <li class="navbar-item">
        <button class="navbar-link" data-tooltip="My Account">
          <div class="icon-circle icon-user">
            <i class="pi pi-user"></i>
          </div>
          <span class="navbar-text">My Account</span>
        </button>
      </li>

      <!-- About -->
      <li class="navbar-item">
        <button class="navbar-link" data-tooltip="About">
          <div class="icon-circle icon-info">
            <i class="pi pi-info-circle"></i>
          </div>
          <span class="navbar-text">About</span>
        </button>
      </li>

    </ul>
  </div>
</nav>
