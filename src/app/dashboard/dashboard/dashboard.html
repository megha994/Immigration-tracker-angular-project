<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<section class="dashboard-shell">

  <div class="progress-grid">
    <p-card class="progress-card">
      <div class="progress-card-main">

        <form [formGroup]="studyPermitForm" class="study-permit-form">
          <div class="radio-label-div">
            <label class="radio-label">Select your application:</label>
          </div>

          <div class="radio-group" role="radiogroup" aria-label="Application location options">

            @for (category of categories(); track category.id) {
            <label class="radio-option" [for]="category.id">

              <p-radiobutton formControlName="selectedCategory"
                name="selectedCategory" [inputId]="category.id" [value]="category" />

              <span>{{ category.category }}</span>
            </label>
            }

          </div>
        </form>

      </div>
    </p-card>

    <p-card class="deadline-card" [style.backgroundColor]="deadlineColor">
      <div class="deadline-main">
        <h3>Deadline</h3>
        <p>{{ deadlineText }}</p>
      </div>

      <i class="pi pi-clock deadline-icon"></i>
    </p-card>
  </div>

  <div class="progress-grid-chart">
    <p-card class="progress-card">
      <app-pie-chart [chartData]="chartData()"></app-pie-chart>
    </p-card>
  </div>
